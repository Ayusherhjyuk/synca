name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Dummy values so the build/typecheck run without real secrets.
      # The DB is only contacted at runtime (pages are dynamic), never at build.
      MONGODB_URI: mongodb://127.0.0.1:27017/ci
      AUTH_SECRET: ci-dummy-secret-0123456789abcdefghijklmnopqrstuv
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_WS_URL: ws://localhost:1234

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit & integration tests (Vitest)
        run: npm test

      - name: Build (Next.js)
        run: npm run build

      - name: Build WS server (typecheck only)
        run: npx tsc --noEmit -p tsconfig.json
